image:
  repository: ghcr.io/dlunch/llmproxy
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
replicaCount: 2

# Existing Secret in the release namespace containing the PostgreSQL connection URL.
database:
  existingSecret: ""
  key: DATABASE_URL

# Keep grace longer than the request timeout plus 30 seconds for an OAuth refresh.
terminationGracePeriodSeconds: 180
resources: {}

# Keep this listener: the Service and probes use port 8080.
config: |
  listen = "0.0.0.0:8080"
  max_concurrent_requests = 16
  request_timeout_seconds = 120

  claude_executable = "/usr/local/bin/claude"
  cookie_secure = true
