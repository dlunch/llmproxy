image:
  repository: ghcr.io/dlunch/llmproxy
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
replicaCount: 2

# Existing Secret in the release namespace containing the PostgreSQL connection URL.
database:
  existingSecret: ""
  key: DATABASE_URL

# Keep grace longer than the request timeout plus 30 seconds for an OAuth refresh.
terminationGracePeriodSeconds: 180
resources: {}

dashboard:
  image:
    repository: ghcr.io/dlunch/llmproxy-dashboard
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  resources: {}
  # Public API and dashboard origins, including scheme, without trailing slash.
  apiUrl: ""
  origin: ""

# Keep this listener: the Service and probes use port 8080.
# dashboard.origin supplies dashboard_origin separately; do not repeat it here.
config: |
  listen = "0.0.0.0:8080"
  max_concurrent_requests = 16
  request_timeout_seconds = 120

  claude_executable = "/usr/local/bin/claude"
  cookie_secure = true
