name: Container images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        product: [api, dashboard]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - product: api
            context: .
            image_suffix: ""
          - product: dashboard
            context: ./dashboard
            image_suffix: -dashboard
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.product }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}-${{ matrix.architecture }}
      - name: Export digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.product }}-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - product: api
            image_suffix: ""
          - product: dashboard
            image_suffix: -dashboard
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.product }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        working-directory: /tmp/digests
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(--tag "$IMAGE:$GITHUB_REF_NAME")
          else
            tags+=(--tag "$IMAGE:latest")
          fi
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
